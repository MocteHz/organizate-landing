<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar cuenta - OrganizaTe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Inter, sans-serif; color: #212121; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 20px; padding: 3rem; max-width: 440px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; }
  .logo { font-size: 1.5rem; font-weight: 800; color: #212121; margin-bottom: 1rem; }
  .logo span { color: #1976D2; }
  h1 { font-size: 1.5rem; margin-bottom: .5rem; color: #212121; }
  p { color: #757575; margin-bottom: 2rem; line-height: 1.6; }
  .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #1976D2; border-radius: 50%; animation: spin .8s linear infinite; margin: 2rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-primary { display: inline-block; background: #1976D2; color: #fff; padding: .9rem 2rem; border-radius: 10px; text-decoration: none; font-weight: 600; }
  .btn-primary:hover { background: #1565C0; }
  .success h2 { color: #2E7D32; margin-bottom: 1rem; }
  .error h2 { color: #D32F2F; margin-bottom: 1rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card" id="loading-card">
  <div class="logo">Organiza<span>Te</span></div>
  <h1>Verificando cuenta...</h1>
  <div class="spinner"></div>
</div>
<div class="card success hidden" id="success-card">
  <h2>✅ Cuenta verificada</h2>
  <p>Tu cuenta ha sido activada correctamente. Ya puedes iniciar sesión.</p>
  <a class="btn-primary" href="https://organizate.mchtec.net">Ir a la aplicación</a>
</div>
<div class="card error hidden" id="error-card">
  <h2>❌ Error de verificación</h2>
  <p id="error-msg">El enlace de verificación no es válido o ha expirado.</p>
  <a class="btn-primary" href="https://organiza.mchtec.net">Ir a OrganizaTe</a>
</div>
<script>
async function verify() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (!token) {
    document.getElementById('loading-card').classList.add('hidden');
    document.getElementById('error-card').classList.remove('hidden');
    document.getElementById('error-msg').textContent = 'Token de verificación no encontrado.';
    return;
  }
  try {
    const resp = await fetch('https://backend.mchtec.net/api/auth/verify-and-create?token=' + encodeURIComponent(token), {
      method: 'POST'
    });
    if (resp.ok) {
      document.getElementById('loading-card').classList.add('hidden');
      document.getElementById('success-card').classList.remove('hidden');
    } else {
      const data = await resp.json();
      document.getElementById('loading-card').classList.add('hidden');
      document.getElementById('error-card').classList.remove('hidden');
      document.getElementById('error-msg').textContent = data.detail || 'Error al verificar la cuenta.';
    }
  } catch(e) {
    document.getElementById('loading-card').classList.add('hidden');
    document.getElementById('error-card').classList.remove('hidden');
    document.getElementById('error-msg').textContent = 'Error de conexión con el servidor.';
  }
}
verify();
</script>
</body>
</html>
